<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | EduResult</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-box">

            <div class="login-logo">
                🎓
            </div>

            <h1>Student Portal</h1>

            <p class="login-subtitle">
                Login to access your school results
            </p>

            <!-- Login Form -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="studentId">
                        Registration Number
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Enter registration number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="session">
                        Academic Session
                    </label>

                    <select id="session" required>

                        <option value="">
                            Select session
                        </option>

                        <option value="2025/2026">
                            2025/2026
                        </option>

                        <option value="2024/2025">
                            2024/2025
                        </option>

                        <option value="2023/2024">
                            2023/2024
                        </option>

                    </select>

                </div>


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>


            <!-- Message -->
            <p id="message"></p>


            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>


    <script>

        // Get login form
        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener("submit", function(event) {

            event.preventDefault();


            // Get values entered by the student

            const studentId =
                document.getElementById("studentId").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const session =
                document.getElementById("session").value;


            const message =
                document.getElementById("message");


            // Check that all fields are filled

            if (
                studentId === "" ||
                password === "" ||
                session === ""
            ) {

                message.textContent =
                    "Please complete all fields.";

                message.style.color = "red";

                return;
            }


            // Get registered students
            // from browser storage

            const students =
                JSON.parse(
                    localStorage.getItem("students")
                ) || [];


            // Find student

            const student =
                students.find(function(user) {

                    return (
                        user.studentId === studentId &&
                        user.password === password
                    );

                });

<div class="demo-info">

    <strong>Demo Student Accounts</strong>

    <p>
        <strong>Aisha Mohammed</strong><br>
        ID: STU001<br>
        Password: demo123
    </p>

    <p>
        <strong>David Okafor</strong><br>
        ID: STU002<br>
        Password: demo456
    </p>

    <p>
        <strong>Fatima Ibrahim</strong><br>
        ID: STU003<br>
        Password: demo789
    </p>

</div>
            // If student does not exist

            if (!student) {

                message.textContent =
                    "Invalid registration number or password.";

                message.style.color = "red";

                return;
            }


            // Save logged-in student

            localStorage.setItem(
                "loggedInStudent",
                JSON.stringify(student)
            );


            // Save selected session

            localStorage.setItem(
                "studentSession",
                session
            );


            // Success message

            message.textContent =
                "Login successful. Opening your portal...";

            message.style.color = "green";


            // Open dashboard

            setTimeout(function() {

                window.location.href =
                    "dashboard.html";

            }, 1000);

        });

    </script>

</body>

</html>
